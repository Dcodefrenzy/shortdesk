services:
  desk:
    build: .
    image: shortdesk/desk:spike
    container_name: shortdesk-desk
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/London
    volumes:
      - desk-home:/config   # persistent home: Chrome profile, logins, Claude config
    ports:
      - "3300:3000"         # desktop in the browser (3000 is often taken on dev machines)
    shm_size: "1gb"
    restart: unless-stopped

volumes:
  desk-home:
