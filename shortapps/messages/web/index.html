<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Messages</title>
<style>
  :root { --background: #f5f6f7; --surface: #fff; --foreground: #15181b; --muted: #62686f; --border: #e2e5e8;
          --accent: #1d7a63; --accent-foreground: #fff; --ok: #23824f; --warn: #a8640f; --danger: #c2372d; }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--background); color: var(--foreground); display: flex; flex-direction: column;
         font: 14px/1.45 "IBM Plex Sans", "Segoe UI", system-ui, sans-serif; }
  button { font: inherit; cursor: pointer; border: 1px solid var(--border); background: var(--surface); color: inherit;
           border-radius: 999px; padding: 6px 12px; }
  .primary { background: var(--accent); color: var(--accent-foreground); border-color: var(--accent); font-weight: 600; }
  .threads { padding: 8px; display: grid; gap: 2px; }
  .thread { display: grid; grid-template-columns: 38px 1fr auto; gap: 10px; align-items: center; padding: 9px 8px;
            border: 0; border-radius: 12px; background: none; text-align: left; width: 100%; }
  .thread:hover { background: var(--surface); }
  .av { width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center; font-size: 18px; background: var(--surface); border: 1px solid var(--border); }
  .thread b { display: block; }
  .thread small { display: block; color: var(--muted); font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .thread .right { display: grid; justify-items: end; gap: 4px; font-size: 11px; color: var(--muted); }
  .n { background: var(--danger); color: #fff; border-radius: 999px; padding: 0 7px; font-weight: 600; font-size: 11px; }
  .head { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-bottom: 1px solid var(--border); background: var(--surface); }
  .head button { border: 0; background: none; color: var(--accent); font-weight: 600; padding: 4px 2px; }
  .head b { flex: 1; }
  .bubbles { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
  .msg { max-width: 85%; display: grid; gap: 4px; }
  .msg.you { align-self: flex-end; }
  .bubble { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 8px 12px; white-space: pre-wrap; word-break: break-word; }
  .you .bubble { background: var(--accent); color: var(--accent-foreground); border-color: var(--accent); }
  .ask .bubble { border: 2px solid var(--warn); }
  .when { font: 11px "IBM Plex Mono", ui-monospace, monospace; color: var(--muted); }
  .you .when { text-align: right; }
  .opts { display: flex; gap: 6px; flex-wrap: wrap; }
  .answered { font-size: 12px; color: var(--muted); }
  form.reply { display: flex; gap: 6px; padding: 8px; border-top: 1px solid var(--border); background: var(--surface); }
  form.reply input { flex: 1; min-width: 0; font: inherit; color: inherit; background: var(--background); border: 1px solid var(--border); border-radius: 999px; padding: 8px 12px; }
  .note { font-size: 12px; color: var(--muted); text-align: center; padding: 0 12px 6px; }
  .empty { color: var(--muted); text-align: center; padding: 40px 16px; }
  .err { color: var(--danger); font-size: 13px; margin: 6px 12px; }
</style>
</head>
<body>
<p class="err" id="err" hidden></p>
<div id="view" style="display:flex;flex-direction:column;flex:1;min-height:0"></div>
<script src="shortapps.js"></script>
<script>
  // A message: { thread, from: "agent" | "you", text, options?: [..], answer?, read? }.
  // thread names what it's about ("Berlin flats", "Your agent"); icon is optional.
  let msgs = [], current = null;
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
  const when = (iso) => { const d = new Date(iso), today = new Date().toDateString() === d.toDateString();
    return today ? d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }) : d.toLocaleDateString([], { day: "numeric", month: "short" }); };

  async function load() {
    try { msgs = await shortapps.list("messages", { orderBy: [{ field: "_created" }], limit: 1000 }); $("err").hidden = true; }
    catch (e) { $("err").textContent = e.message; $("err").hidden = false; }
    render();
  }
  async function run(fn) { try { await fn(); } catch (e) { $("err").textContent = e.message; $("err").hidden = false; } await load(); }

  function threads() {
    const by = new Map();
    for (const m of msgs) {
      const t = m.data.thread || "Your agent";
      if (!by.has(t)) by.set(t, []);
      by.get(t).push(m);
    }
    return [...by.entries()].sort((a, b) => b[1].at(-1).created.localeCompare(a[1].at(-1).created));
  }
  const unread = (list) => list.filter((m) => m.data.from !== "you" && !m.data.read).length;

  function render() {
    if (current) return renderThread();
    const ts = threads();
    $("view").innerHTML = ts.length ? `<div class="threads">${ts.map(([name, list]) => {
      const last = list.at(-1), u = unread(list), icon = list.find((m) => m.data.icon)?.data.icon || (name === "Your agent" ? "🤖" : "💬");
      return `<button class="thread" data-thread="${esc(name)}"><span class="av">${esc(icon)}</span>
        <span style="min-width:0"><b>${esc(name)}</b><small>${esc(last.data.text)}</small></span>
        <span class="right">${when(last.created)}${u ? `<span class="n">${u}</span>` : ""}</span></button>`;
    }).join("")}</div>` : `<p class="empty">No messages yet. When your agent needs to tell or ask you something, it shows up here.</p>`;
  }

  function renderThread() {
    const list = msgs.filter((m) => (m.data.thread || "Your agent") === current);
    $("view").innerHTML = `<div class="head"><button data-back>‹ All</button><b>${esc(current)}</b></div>
      <div class="bubbles" id="bubbles">${list.map((m) => {
        const d = m.data, you = d.from === "you", ask = !you && d.options?.length;
        return `<div class="msg ${you ? "you" : ""} ${ask && !d.answer ? "ask" : ""}"><span class="when">${you ? "you" : "your agent"} · ${when(m.created)}</span>
          <div class="bubble">${esc(d.text)}</div>
          ${ask ? (d.answer ? `<span class="answered">You answered: ${esc(d.answer)}</span>`
            : `<div class="opts">${d.options.map((o, i) => `<button class="${i ? "" : "primary"}" data-answer="${m.id}" data-choice="${esc(o)}">${esc(o)}</button>`).join("")}</div>`) : ""}
        </div>`;
      }).join("")}</div>
      <form class="reply" id="reply"><input id="text" placeholder="Reply to your agent…" autocomplete="off" aria-label="Reply"><button class="primary">Send</button></form>
      <p class="note">Your agent reads replies on its next task.</p>`;
    const b = $("bubbles"); b.scrollTop = b.scrollHeight;
    // Opening a thread marks the agent's messages in it as read, then reloads so the
    // answer buttons hold the new versions.
    const unreadNow = list.filter((m) => m.data.from !== "you" && !m.data.read);
    if (unreadNow.length)
      Promise.all(unreadNow.map((m) => shortapps.update("messages", m.id, { read: true }, m.version).catch(() => {}))).then(load);
  }

  document.addEventListener("click", (e) => {
    const b = e.target.closest("[data-thread],[data-back],[data-answer]");
    if (!b) return;
    if (b.dataset.thread) { current = b.dataset.thread; render(); }
    else if (b.dataset.back !== undefined) { current = null; load(); }
    else if (b.dataset.answer) {
      const m = msgs.find((x) => x.id === b.dataset.answer);
      run(() => shortapps.update("messages", m.id, { answer: b.dataset.choice, read: true }, m.version));
    }
  });
  document.addEventListener("submit", (e) => {
    e.preventDefault();
    const text = $("text").value.trim(); if (!text) return;
    $("text").value = "";
    run(() => shortapps.add("messages", { thread: current, from: "you", text, read: true }));
  });
  shortapps.onChange(load);
  shortapps.ready.then(load);
</script>
</body>
</html>
