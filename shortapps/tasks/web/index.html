<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tasks</title>
<style>
  :root { --background: #f5f6f7; --surface: #fff; --foreground: #15181b; --muted: #62686f; --border: #e2e5e8;
          --accent: #1d7a63; --accent-foreground: #fff; --ok: #23824f; --warn: #a8640f; --danger: #c2372d; }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 12px; background: var(--background); color: var(--foreground);
         font: 14px/1.45 "IBM Plex Sans", "Segoe UI", system-ui, sans-serif; }
  form.add { display: flex; gap: 6px; margin-bottom: 12px; }
  input, textarea, select { font: inherit; color: inherit; background: var(--surface); border: 1px solid var(--border);
         border-radius: 10px; padding: 8px 10px; min-width: 0; }
  input:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  button { font: inherit; cursor: pointer; border: 1px solid var(--border); background: var(--surface); color: inherit;
           border-radius: 999px; padding: 6px 12px; }
  .primary { background: var(--accent); color: var(--accent-foreground); border-color: var(--accent); font-weight: 600; }
  .add input { flex: 1; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
  .chip { font-size: 12px; padding: 3px 10px; }
  .chip[aria-pressed="true"] { background: var(--accent); color: var(--accent-foreground); border-color: var(--accent); }
  h2 { font: 500 11px "IBM Plex Mono", ui-monospace, monospace; text-transform: uppercase; letter-spacing: .06em;
       color: var(--muted); margin: 14px 4px 6px; }
  ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
  li { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 9px 11px;
       display: grid; grid-template-columns: 22px 1fr auto; gap: 10px; align-items: start; }
  .tick { width: 20px; height: 20px; border-radius: 50%; border: 2px solid var(--border); padding: 0; margin-top: 1px; }
  .done .tick { background: var(--accent); border-color: var(--accent); }
  .done .title { text-decoration: line-through; color: var(--muted); }
  .title { font-weight: 500; word-break: break-word; }
  .meta { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .status { font: 500 11px "IBM Plex Mono", ui-monospace, monospace; border-radius: 6px; padding: 1px 7px;
            background: var(--background); border: 1px solid var(--border); }
  .s-doing, .s-queued { color: var(--accent); } .s-waiting { color: var(--warn); } .s-failed { color: var(--danger); }
  .result { margin-top: 6px; font-size: 13px; background: var(--background); border-radius: 8px; padding: 6px 8px; white-space: pre-wrap; }
  .edit { grid-column: 1 / -1; display: grid; gap: 6px; }
  .edit .row { display: flex; gap: 6px; flex-wrap: wrap; }
  .empty { color: var(--muted); text-align: center; padding: 30px 10px; }
  .err { color: var(--danger); font-size: 13px; margin: 6px 4px; }
</style>
</head>
<body>
<form class="add" id="add"><input id="title" placeholder="Add a task…" aria-label="New task" autocomplete="off"><button class="primary">Add</button></form>
<div class="chips" id="chips" role="group" aria-label="Show"></div>
<p class="err" id="err" hidden></p>
<div id="list"></div>
<script src="shortapps.js"></script>
<script>
  const STATUSES = [["waiting", "Waiting for you"], ["doing", "Doing"], ["queued", "Queued for a helper"], ["todo", "To do"],
                    ["failed", "Didn't finish"], ["done", "Done"]];
  let tasks = [], show = "open", open = null;
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
  const ago = (iso) => { const m = Math.round((Date.now() - new Date(iso)) / 60000);
    return m < 1 ? "just now" : m < 60 ? m + "m ago" : m < 1440 ? Math.round(m / 60) + "h ago" : Math.round(m / 1440) + "d ago"; };

  async function load() {
    try { tasks = await shortapps.list("tasks", { orderBy: [{ field: "_updated", desc: true }], limit: 500 }); $("err").hidden = true; }
    catch (e) { fail(e); }
    render();
  }
  function fail(e) { $("err").textContent = e.message; $("err").hidden = false; }
  async function run(fn) { try { await fn(); } catch (e) { fail(e); } await load(); }

  function render() {
    const closed = (t) => t.data.status === "done" || t.data.status === "failed";
    const counts = { open: tasks.filter((t) => !closed(t)).length, done: tasks.filter(closed).length };
    $("chips").innerHTML = [["open", "Open " + counts.open], ["done", "Done " + counts.done], ["all", "All " + tasks.length]]
      .map(([k, l]) => `<button class="chip" data-show="${k}" aria-pressed="${show === k}">${l}</button>`).join("");
    const visible = tasks.filter((t) => show === "all" || (show === "done") === closed(t));
    if (!visible.length) { $("list").innerHTML = `<p class="empty">${tasks.length ? "Nothing here." : "No tasks yet. Ask your agent for something, or add one above."}</p>`; return; }
    $("list").innerHTML = STATUSES.map(([s, label]) => {
      const group = visible.filter((t) => (t.data.status || "todo") === s);
      if (!group.length) return "";
      return `<h2>${label} · ${group.length}</h2><ul>${group.map(item).join("")}</ul>`;
    }).join("");
  }
  function item(t) {
    const d = t.data, s = d.status || "todo";
    const editing = open === t.id;
    return `<li class="${s === "done" ? "done" : ""}">
      <button class="tick" data-tick="${t.id}" aria-label="${s === "done" ? "Mark not done" : "Mark done"}"></button>
      <div data-open="${t.id}" style="cursor:pointer"><div class="title">${esc(d.title)}</div>
        <div class="meta">${d.desk ? "🖥 " + esc(d.desk) + " · " : ""}${esc(t.updatedBy)} · ${ago(t.updated)}${d.notes && !editing ? " · " + esc(d.notes).slice(0, 80) : ""}</div>
        ${d.result && !editing ? `<div class="result">${esc(d.result).slice(0, 400)}</div>` : ""}</div>
      <span class="status s-${s}">${s}</span>
      ${editing && d.instructions ? `<div class="result" style="grid-column:1/-1"><b>Instructions for the helper</b>\n${esc(d.instructions)}</div>` : ""}
      ${editing ? `<form class="edit" data-edit="${t.id}">
        <input name="title" value="${esc(d.title)}" aria-label="Title">
        <textarea name="notes" rows="3" placeholder="Notes" aria-label="Notes">${esc(d.notes)}</textarea>
        <div class="row"><select name="status" aria-label="Status">${STATUSES.map(([v, l]) => `<option value="${v}" ${v === s ? "selected" : ""}>${l}</option>`).join("")}</select>
        <button class="primary">Save</button><button type="button" data-cancel>Cancel</button><button type="button" data-del="${t.id}" style="margin-left:auto;color:var(--danger)">Delete</button></div>
      </form>` : ""}
    </li>`;
  }
  const byId = (id) => tasks.find((t) => t.id === id);

  document.addEventListener("click", (e) => {
    const b = e.target.closest("[data-show],[data-tick],[data-open],[data-cancel],[data-del]");
    if (!b) return;
    if (b.dataset.show) { show = b.dataset.show; render(); }
    else if (b.dataset.tick) { const t = byId(b.dataset.tick); run(() => shortapps.update("tasks", t.id, { status: t.data.status === "done" ? "todo" : "done" }, t.version)); }
    else if (b.dataset.open) { open = open === b.dataset.open ? null : b.dataset.open; render(); }
    else if (b.dataset.cancel !== undefined) { open = null; render(); }
    else if (b.dataset.del) { const t = byId(b.dataset.del); if (confirm("Delete this task?")) { open = null; run(() => shortapps.remove("tasks", t.id, t.version)); } }
  });
  document.addEventListener("submit", (e) => {
    e.preventDefault();
    if (e.target.id === "add") {
      const title = $("title").value.trim(); if (!title) return;
      $("title").value = "";
      run(() => shortapps.add("tasks", { title, status: "todo" }));
    } else if (e.target.dataset.edit) {
      const t = byId(e.target.dataset.edit), f = new FormData(e.target);
      open = null;
      run(() => shortapps.update("tasks", t.id, { title: f.get("title").trim() || t.data.title, notes: f.get("notes").trim() || null, status: f.get("status") }, t.version));
    }
  });
  shortapps.onChange(load);
  shortapps.ready.then(load);
</script>
</body>
</html>
